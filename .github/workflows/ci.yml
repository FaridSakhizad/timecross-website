# Every push to master and stage and every pull request: commit messages, Worker types,
# type-check, lint, tests and the production build, on a clean install from package-lock.json.
name: CI

on:
  push:
    branches: [master, stage]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Required by .github/rulesets/protect-master.json under this name.
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so commitlint can read the pushed commits.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # The commits of the pull request, or the commits of the push (not on a new branch).
      - name: Commit messages (pull request)
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Commit messages (push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: npx commitlint --from ${{ github.event.before }} --to ${{ github.sha }} --verbose

      - name: Worker types, type-check, lint, tests
        run: npm run check

      - name: Build
        run: npm run build

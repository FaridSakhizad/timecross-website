<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <script>
      /* Apply the saved color mode before the first paint to avoid a day/night flash. */
      try {
        var timecrossSettings = JSON.parse(localStorage.getItem('timecross:settings') || 'null');
        if (timecrossSettings && timecrossSettings.colorMode === 'night') {
          document.documentElement.dataset.colorMode = 'night';
        }
      } catch (error) {}
    </script>
    <title>TimeCross — World Clock and Time Zone Planner</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#f2d85f" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover" />
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>

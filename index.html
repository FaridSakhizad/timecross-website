<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timezone converter Terms of Use</title>
    <style>
        html, body {
            height: 100%;
            padding: 0;
            margin: 0;
        }

        html {
            /*background: url("./assets/bg--main-1.png") center / cover no-repeat;*/
            background:
                    radial-gradient(circle at top left,     #ff5a5f 0%, transparent 75%),
                    radial-gradient(circle at top right,    #ffd166 0%, transparent 75%),
                    radial-gradient(circle at bottom left,  #4d7cfe 0%, transparent 75%),
                    radial-gradient(circle at bottom right, #06d6a0 0%, transparent 75%),
                    #ffffff;
        }

        body {
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 15px;

            /*background-color: rgba(62 63 86 / .4);*/
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .content {
            text-align: center;
            align-content: center;
            min-height: 100dvh;
        }

        .h1 {
            font-weight: 300;
            color: white;
        }

        .h2 {
            font-weight: 300;
            color: white;
        }

        .links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
        }

        .appStore {
            display: block;
            width: 170px;
            height: 50px;
            background: url("./src/assets/download-on-the-app-store.svg") center / cover no-repeat;
        }

        .gPlay {
            width: 170px;
            height: 50px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;

            &.disabled {
                &:before {
                    content: '';
                    display: block;
                    position: absolute;
                    left: 0;
                    top: 0;
                    width: 100%;
                    height: 100%;
                    background: url("./assets/download-on-the-google-play.svg") center / contain no-repeat;
                    z-index: 0;
                    opacity: 0.05;
                }
            }
        }

        .gPlay-soon {
            display: block;
            position: relative;
            z-index: 2;
            color: #fff;
        }

        .support {
            color: white;
            font-size: 18px;

            a {
                color: rgba(255, 255, 204, 1);
                font-weight: bold;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="content">
        <h1 class="h1">Time Cross</h1>
        <h2 class="h2">Understand Time Across the World</h2>

        <div class="links">
            <a href="https://apps.apple.com/ca/app/timecross-world-clock/id6770122132" class="appStore"></a>
            <!--
                <a href="#" class="gPlay disabled">
                    <span class="gPlay-soon">Coming Soon</span>
                </a>
            -->
        </div>

        <div class="support">Contact: <a href="mailto:support@timecross.app">support@timecross.app</a></div>
    </div>
</div>
</body>
</html>
